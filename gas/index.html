<style>
/* Layout: ledger workstation — fixed left rail of modules, a working pane with summary strip on top and tables below. */
:root{
  --paper:#f5f6f3; --panel:#ffffff; --ink:#172430; --muted:#5d6b73; --line:#dde2df; --soft:#eef1ee;

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

:root[data-theme="dark"]{

  --good:#5cc489; --good-soft:#163526; --warn:#e6b04e; --warn-soft:#3a2d12; --bad:#ec7a72; --bad-soft:#3d1c1a;

html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100%}

main{min-width:0;padding-block:20px 48px;padding-left:max(16px,24px);padding-right:max(16px,env(safe-area-inset-right,0px),24px);display:flex;flex-direction:column;gap:18px}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}

.role button:last-child{border-right:0}

.role button:focus-visible{outline:2px solid var(--teal);outline-offset:-2px}
.demo{font-size:12px;background:var(--ochre-soft);color:var(--ochre);border-radius:6px;padding:6px 10px}

.scroll{overflow-x:auto}

td{padding:7px 8px;border-bottom:1px solid var(--soft);vertical-align:top}
td.num,th.num{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.total td{font-weight:600;border-top:1px solid var(--line);border-bottom:0}
tr.sel td{background:var(--teal-soft)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;border-radius:10px;padding:1px 8px;white-space:nowrap;background:var(--soft);color:var(--muted)}
.chip.good{background:var(--good-soft);color:var(--good)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.teal{background:var(--teal-soft);color:var(--teal)} .chip.ochre{background:var(--ochre-soft);color:var(--ochre)}
.flag{display:block;font-size:11.5px;color:var(--bad);margin-top:2px}
.muted{color:var(--muted)} .small{font-size:12px}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 12px;font-size:13px}
.btn:hover{border-color:var(--teal)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.xs{padding:2px 8px;font-size:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;align-items:end}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.form label.wide{grid-column:span 2}
.issues{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.issues li{display:grid;grid-template-columns:8px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-radius:6px;background:var(--soft)}
.issues li i{width:8px;height:8px;border-radius:50%;background:var(--warn)}
.issues li.bad i{background:var(--bad)} .issues li.good i{background:var(--good)}
.vs{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr);gap:0}
.vs>div{padding:8px 10px;border-bottom:1px solid var(--soft)}
.vs .h{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600}

.bars{display:flex;flex-direction:column;gap:8px}

.bar .track{height:14px;background:var(--soft);border-radius:3px;position:relative;overflow:hidden}
.bar .fill{position:absolute;inset:0 auto 0 0;background:var(--teal);border-radius:3px}
.bar .fill.over{background:var(--bad)}
.bar .budget{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
.bar .val{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums}
.att{border-collapse:separate;border-spacing:2px;font-size:11.5px}
.att th{padding:2px;text-align:center;font-size:10px;letter-spacing:0}

.att td{padding:0;border:0}
.att td.name{padding-right:8px;white-space:nowrap;font-size:12.5px}
.att button{all:unset;cursor:pointer;width:24px;height:24px;display:grid;place-items:center;border-radius:4px;background:var(--soft);font-family:var(--f-num);font-size:11px}

.att button:focus-visible{outline:2px solid var(--teal)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted)}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:8px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.2);z-index:20}
.steps{display:flex;gap:4px;align-items:center;font-size:11.5px}
.steps span{padding:1px 7px;border-radius:10px;background:var(--soft);color:var(--muted)}
.steps span.on{background:var(--teal-soft);color:var(--teal)}
.lock{display:inline-flex;align-items:center;gap:6px}
details summary{cursor:pointer;color:var(--teal);font-size:12.5px}
.empty{padding:16px;text-align:center;color:var(--muted)}
@media (max-width:980px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:minmax(0,1fr)}}

}
@media (max-width:440px){.tiles{grid-template-columns:minmax(0,1fr)}.form label.wide{grid-column:auto}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

const USERS_DB = {

const USER_SESSION_KEY = "vpm_active_user";

function getCurrentUser() {
  try {
    const s = sessionStorage.getItem(USER_SESSION_KEY) || localStorage.getItem(USER_SESSION_KEY);
    return s ? JSON.parse(s) : null;
  } catch (e) {
    return null;
  }
}

function setCurrentUser(u) {
  try {
    if (u) {
      sessionStorage.setItem(USER_SESSION_KEY, JSON.stringify(u));
      localStorage.setItem(USER_SESSION_KEY, JSON.stringify(u));
    } else {
      sessionStorage.removeItem(USER_SESSION_KEY);
      localStorage.removeItem(USER_SESSION_KEY);
    }
  } catch (e) {}
}

function checkAuth() {
  const u = getCurrentUser();
  const loginScr = $("#loginScreen");
  const appLayout = $("#appLayout");
  if (!u) {
    if (loginScr) loginScr.style.display = "flex";
    if (appLayout) appLayout.style.display = "none";
    return false;
  }
  if (loginScr) loginScr.style.display = "none";
  if (appLayout) appLayout.style.display = "";
  UI.role = u.role;
  return true;
}

function doLogin(username, password) {
  const uKey = String(username).trim().toLowerCase();
  const pass = String(password).trim();
  const errEl = $("#loginError");
  if (errEl) errEl.style.display = "none";

  if (isGas()) {
    try {
      const btn = $("#loginSubmitBtn");
      if (btn) btn.textContent = "Đang xác thực...";
      window.google.script.run
        .withSuccessHandler(function(res) {
          if (btn) btn.textContent = "Đăng nhập vào hệ thống";
          if (res && res.success && res.user) {
            setCurrentUser(res.user);
            UI.role = res.user.role;
            checkAuth();
            render();
            toast("Xin chào " + res.user.fullname + " (" + (res.user.title || ROLES[res.user.role] || res.user.role) + ")");
          } else {
            showLoginError((res && res.message) || "Sai tên đăng nhập hoặc mật khẩu");
          }
        })
        .withFailureHandler(function(err) {
          if (btn) btn.textContent = "Đăng nhập vào hệ thống";
          localAuth(uKey, pass);
        })
        .apiLogin(uKey, pass);
      return;
    } catch (e) {
      // fallback local auth
    }
  }

  localAuth(uKey, pass);
}

function localAuth(uKey, pass) {
  const u = USERS_DB[uKey];
  if (u && u.pass === pass) {
    setCurrentUser(u);
    UI.role = u.role;
    checkAuth();
    render();
    toast("Xin chào " + u.fullname + " (" + u.title + ")");
  } else {
    showLoginError("Sai tên đăng nhập hoặc mật khẩu! (Mật khẩu mặc định: 123456)");
  }
}

function showLoginError(msg) {
  const errEl = $("#loginError");
  if (errEl) {
    errEl.textContent = msg;
    errEl.style.display = "block";
  } else {
    alert(msg);
  }
}

function doLogout() {
  if (confirm("Master có chắc chắn muốn đăng xuất khỏi hệ thống không?")) {
    setCurrentUser(null);
    checkAuth();
    toast("Đã đăng xuất khỏi hệ thống");
  }
}

const fmt = n => (Math.round(n) || 0).toLocaleString("vi-VN");
const fm = n => (n < 0 ? "−" : "") + fmt(Math.abs(n));
const mil = n => (n / 1e6).toLocaleString("vi-VN", {maximumFractionDigits: 2}) + " tr";

const mon = s => s.slice(0, 7);

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const $ = s => document.querySelector(s);

const monthLabel = m => "Tháng " + Number(m.slice(5)) + "/" + m.slice(0, 4);

/* ---------- derived ---------- */
function needsApproval(t) { return t.dir === "out" && t.amt >= APPROVE_LIMIT && t.status !== "migrated"; }
function txIssues(t) {
  const out = [...(t.flags || [])];
  if (t.status !== "migrated" && !t.doc && t.acc !== "BT") out.push("Chưa đính chứng từ");
  if ((t.type === "THU_KH" || t.type === "THU_TV") && !t.contract) out.push("Chưa gắn hợp đồng");
  return out;
}
function paymentsOf(cid) { return S.tx.filter(t => t.contract === cid && (t.type === "THU_KH" || t.type === "THU_TV") && t.status !== "returned"); }
function debt(c) {
  const due = c.fee - c.disc, pays = paymentsOf(c.id), paid = pays.reduce((s, t) => s + t.amt, 0), left = due - paid;
  const over = left > 0 && c.due && c.due < TODAY ? days(c.due, TODAY) : 0;
  const rate = c.fee ? c.disc / c.fee : 0;
  const status = left <= 0 ? (left < 0 ? "Thu dư" : "Xong") : over ? "Quá hạn" : "Trong hạn";
  return {due, paid, left, over, rate, status, pays, discOk: rate <= DISC_LIMIT || c.discApproved};
}
function balance(acc, until) {
  let b = OPEN_BAL[acc] || 0;
  for (const t of S.tx) if (t.acc === acc && t.date <= until && t.status !== "returned") b += t.dir === "in" ? t.amt : -t.amt;
  return b;
}
function lastDay(m) { const [y, mm] = m.split("-").map(Number); return m + "-" + String(new Date(Date.UTC(y, mm, 0)).getUTCDate()).padStart(2, "0"); }
function prevMonth(m) { const [y, mm] = m.split("-").map(Number); return mm === 1 ? (y - 1) + "-12" : y + "-" + String(mm - 1).padStart(2, "0"); }
function monthTx(m) { return S.tx.filter(t => mon(t.date) === m && t.status !== "returned"); }
function opexBy(m) { const r = {}; for (const k in CATS) r[k] = 0; for (const t of monthTx(m)) if (t.type === "OPEX") r[t.cat] += t.amt; return r; }
function minBalance(acc, m) {
  let b = balance(acc, lastDay(prevMonth(m))), min = b, minD = null;
  const rows = S.tx.filter(t => t.acc === acc && mon(t.date) === m && t.status !== "returned").sort((a, b) => a.date.localeCompare(b.date));
  rows.forEach((t, i) => { b += t.dir === "in" ? t.amt : -t.amt; const endOfDay = i === rows.length - 1 || rows[i + 1].date !== t.date; if (endOfDay && b < min) { min = b; minD = t.date; } });
  return {min, minD};
}
function giftStock() {
  const st = {};
  for (const it of S.gifts.items) st[it.id] = {in: 0, out: 0};
  for (const m of S.gifts.mv) st[m.item][m.kind] += m.qty;
  return st;
}
function allIssues() {
  const list = [];
  const pendCheck = S.tx.filter(t => t.status === "pending").length;
  const pendAppr = S.tx.filter(t => t.status === "checked" && needsApproval(t)).length;
  if (pendCheck) list.push({lvl: "warn", text: `${pendCheck} giao dịch chờ VPM kiểm tra`, go: "ledger", f: "pending"});
  if (pendAppr) list.push({lvl: "warn", text: `${pendAppr} khoản chi từ ${fmt(APPROVE_LIMIT)} đ chờ chị Giàu duyệt`, go: "ledger", f: "approve"});
  const unk = S.tx.filter(t => t.type === "THU_KHAC" && (t.flags || []).some(f => f.startsWith("Chưa rõ")));
  if (unk.length) list.push({lvl: "bad", text: `${unk.length} khoản thu ${mil(unk.reduce((s, t) => s + t.amt, 0))} chưa rõ của ai, cho hợp đồng nào`, go: "ledger", f: "flag"});
  const off = S.tx.filter(t => (t.flags || []).includes("Có trong sổ công nợ, không có trong sổ quỹ"));
  if (off.length) list.push({lvl: "bad", text: `${off.length} khoản thu chỉ ghi ở sổ công nợ, không thấy tiền về sổ quỹ (${mil(off.reduce((s, t) => s + t.amt, 0))})`, go: "ledger", f: "flag"});
  const neg = ["2026-08", "2026-09", "2026-10"].map(m => [m, minBalance("QUY", m)]).filter(([, r]) => r.min < 0);
  for (const [m, r] of neg) list.push({lvl: "bad", text: `Sổ quỹ âm ${fm(r.min)} đ trong ${monthLabel(m).toLowerCase()} (cuối ngày ${dmy(r.minD || m + "-01")})`, go: "report"});
  const ov = S.contracts.map(c => [c, debt(c)]).filter(([, d]) => d.over);
  if (ov.length) list.push({lvl: "bad", text: `${ov.length} hợp đồng quá hạn, tổng ${mil(ov.reduce((s, [, d]) => s + d.left, 0))}`, go: "debt"});
  const disc = S.contracts.filter(c => !debt(c).discOk);
  if (disc.length) list.push({lvl: "warn", text: `${disc.length} hợp đồng chiết khấu trên ${DISC_LIMIT * 100}% chưa được duyệt`, go: "debt"});
  const nodate = S.tx.filter(t => (t.flags || []).includes("Thiếu ngày giao dịch")).length;
  if (nodate) list.push({lvl: "warn", text: `${nodate} dòng nhập từ file cũ thiếu ngày giao dịch`, go: "ledger", f: "flag"});
  const attA = attAlerts().length;
  if (attA) list.push({lvl: "warn", text: `${attA} ô chấm công T9 cần xác nhận (ngày lễ, chủ nhật)`, go: "payroll"});
  return list;
}

/* ---------- payroll ---------- */
function attDays() {
  const [y, m] = (S.attMonth || "2026-09").split("-").map(Number), n = new Date(Date.UTC(y, m, 0)).getUTCDate(), out = [];
  for (let d = 1; d <= n; d++) { const iso = S.attMonth + "-" + String(d).padStart(2, "0"), wd = new Date(iso + "T00:00:00Z").getUTCDay(); out.push({iso, d, wd, sun: wd === 0, sat: wd === 6, hol: (S.holidays || []).includes(iso)}); }
  return out;
}
function stdDays() { const ds = attDays(); return ds.length - ds.filter(x => x.sun).length - 0.5 * ds.filter(x => x.sat).length; }
function attAlerts() {
  const out = [];
  for (const d of attDays()) for (const s of S.staff) {
    const v = (S.att[s.name] || {days: {}}).days[d.iso];
    if (d.hol && (v === 1 || v === 0.5)) out.push({s: s.name, d: d.iso, msg: "Ngày lễ đang chấm như ngày thường"});
    if (d.sun && (v === 1 || v === 0.5)) out.push({s: s.name, d: d.iso, msg: "Chủ nhật chấm 1 – đi làm thì chọn 200%"});
  }
  return out;
}
function pit(x) {
  if (x <= 0) return 0;
  const b = [[10e6, .05], [30e6, .10], [60e6, .20], [100e6, .30], [Infinity, .35]];
  let tax = 0, prev = 0;
  for (const [cap, r] of b) { if (x > prev) tax += (Math.min(x, cap) - prev) * r; prev = cap; }
  return Math.round(tax);
}
function pay(s) {
  const a = (S.att[s.name] || {days: {}}).days, std = stdDays(), allow = s.allow.phone + s.allow.fuel + s.allow.meal + s.allow.travel;
  const rate = (s.base + allow) / std;
  let work = 0, hol = 0, holWork = 0, sunWork = 0;
  for (const d of attDays()) {
    const v = a[d.iso];
    if (v === "L") hol += 1; else if (v === "X") holWork += 1; else if (v === 2) sunWork += 1; else if (typeof v === "number") work += v;
  }
  const byDays = rate * (work + hol), extra = rate * (holWork * 3 + sunWork * 2);
  const gross = byDays + extra + s.kpi;
  const ins = s.insSalary * 0.105;
  const exempt = byDays * allow / (s.base + allow || 1) + rate * (holWork * 2 + sunWork * 1);
  const taxable = Math.max(0, gross - ins - exempt - DEDUCT_SELF - s.deps * DEDUCT_DEP);
  const tax = pit(taxable);
  return {std, work: work + hol, holWork, sunWork, byDays, extra, gross, ins, taxable, tax, net: gross - ins - tax - s.advance};
}

function statusChip(t) {
  if (t.status === "migrated") return `<span class="chip">Từ file cũ</span>`;

  if (needsApproval(t)) steps.push(["approved", "Chị Giàu duyệt"]);
  const order = {pending: 0, checked: 1, approved: 2, returned: -1};
  if (t.status === "returned") return `<span class="chip bad">Trả lại: ${esc(t.note || "")}</span>`;
  const done = order[t.status];
  const fin = needsApproval(t) ? t.status === "approved" : t.status !== "pending";
  return `<span class="steps">${steps.map(([k, l], i) => `<span class="${i <= done ? "on" : ""}">${l}</span>`).join("")}</span>${fin ? ` <span class="chip good">Xong</span>` : ""}`;

  ${ps.map(([s, p]) => `<tr><td>${esc(s.name)}<div class="small muted">${esc(s.role)} · lương ${mil(s.base)}${s.insSalary ? "" : ' · <span style="color:var(--warn)">chưa đóng BHXH</span>'}</div></td>
    <td class="num">${p.work}${s.oldDays !== p.work ? `<div class="small muted">cũ ${s.oldDays}</div>` : ""}</td><td class="num">${fmt(p.byDays)}</td><td class="num">${fmt(p.extra)}</td><td class="num">${fmt(s.kpi)}</td><td class="num">${fmt(p.ins)}</td>
    <td class="num">${fmt(p.tax)}${s.oldTax ? `<div class="small" style="color:var(--bad)">cũ ${fmt(s.oldTax)}</div>` : ""}</td>
    <td class="num"><input type="number" data-adv="${s.id}" value="${s.advance}" min="0" step="100000" style="width:110px;text-align:right" aria-label="Tạm ứng ${esc(s.name)}" ${canDo("att") ? "" : "disabled"}></td>
    <td class="num"><b>${fmt(p.net)}</b></td><td class="num muted">${fmt(s.oldNet)}</td></tr>`).join("")}
  <tr class="total"><td>Tổng</td><td></td><td class="num">${fmt(sum("byDays"))}</td><td class="num">${fmt(sum("extra"))}</td><td class="num">${fmt(S.staff.reduce((a, s) => a + s.kpi, 0))}</td><td class="num">${fmt(sum("ins"))}</td><td class="num">${fmt(sum("tax"))}</td><td class="num">${fmt(S.staff.reduce((a, s) => a + s.advance, 0))}</td><td class="num">${fmt(sum("net"))}</td><td class="num muted">${fmt(S.staff.reduce((a, s) => a + s.oldNet, 0))}</td></tr>
  </tbody></table></div>
  <p class="small muted" style="margin:0">Biểu thuế 5 bậc và mức giảm trừ lấy theo file lương hiện tại của khách và quy định từ kỳ tính thuế 2026; VPM rà lại trước khi dùng thật. Tạm ứng nhập theo từng người thay cho dòng "đã trừ 6 tr ứng T9" ghi tay.</p>
  </section>`;
}

function vReport() {
  const m = UI.month, rows = monthTx(m), op = opexBy(m), b = S.budget[m] || {};
  const totOp = Object.values(op).reduce((a, c) => a + c, 0), totB = Object.values(b).reduce((a, c) => a + (+c || 0), 0);
  const by = (dir) => { const r = {}; for (const t of rows) if (t.dir === dir) r[t.type] = (r[t.type] || 0) + t.amt; return r; };
  const ins = by("in"), outs = by("out"), max = Math.max(...Object.keys(CATS).map(k => Math.max(op[k], +b[k] || 0)), 1);
  const acc = a => ({open: balance(a, lastDay(prevMonth(m))), close: balance(a, lastDay(m))});
  return `
  <div class="tiles">
    <div class="tile"><span class="k">Chi phí vận hành</span><span class="v">${fm(totOp)}</span><span class="n">${totB ? "Ngân sách " + mil(totB) : "Chưa giao ngân sách"}</span></div>
    <div class="tile"><span class="k">Ứng phí hộ khách</span><span class="v">${fm(outs.UNG_PHI || 0)}</span><span class="n">Không phải chi phí, theo dõi qua công nợ</span></div>
    <div class="tile"><span class="k">Khách, tư vấn trả nợ</span><span class="v">${fm((ins.THU_KH || 0) + (ins.THU_TV || 0))}</span><span class="n">Mọi tài khoản trong tháng</span></div>
    <div class="tile ${acc("QUY").close < 0 ? "bad" : ""}"><span class="k">Tồn sổ quỹ cuối kỳ</span><span class="v">${fm(acc("QUY").close)}</span><span class="n">Đầu kỳ ${fm(acc("QUY").open)}</span></div>
  </div>
  <section class="card"><h2>Chi phí vận hành so với ngân sách <small>vạch đen là ngân sách chị Giàu giao</small></h2>
  <div class="bars">${Object.entries(CATS).map(([k, l]) => { const v = op[k], bud = +b[k] || 0, over = bud && v > bud; return `<div class="bar"><span>${l}</span><div class="track"><div class="fill ${over ? "over" : ""}" style="width:${v / max * 100}%"></div>${bud ? `<div class="budget" style="left:${bud / max * 100}%"></div>` : ""}</div><span class="val">${fmt(v)}${bud ? `<div class="small ${over ? "" : "muted"}" style="${over ? "color:var(--bad)" : ""}">NS ${fmt(bud)}</div>` : ""}</span></div>`; }).join("")}</div>
  ${canDo("budget") ? `<details><summary>Giao ngân sách ${monthLabel(m).toLowerCase()}</summary><form id="bForm" class="form" style="margin-top:8px">${Object.entries(CATS).map(([k, l]) => `<label>${l}<input type="number" min="0" step="100000" data-bud="${k}" value="${b[k] || ""}"></label>`).join("")}<div><button class="btn primary" type="submit">Lưu ngân sách</button></div></form></details>` : ""}
  </section>
  <div class="grid2">
  <section class="card"><h2>Dòng tiền theo loại</h2><table><thead><tr><th>Loại</th><th class="num">Thu</th><th class="num">Chi</th></tr></thead><tbody>
  ${Object.entries(TYPES).map(([k, v]) => `<tr><td>${v.l}</td><td class="num">${ins[k] ? fmt(ins[k]) : ""}</td><td class="num">${outs[k] ? fmt(outs[k]) : ""}</td></tr>`).join("")}
  <tr class="total"><td>Tổng</td><td class="num">${fmt(Object.values(ins).reduce((a, c) => a + c, 0))}</td><td class="num">${fmt(Object.values(outs).reduce((a, c) => a + c, 0))}</td></tr></tbody></table></section>
  <section class="card"><h2>Số dư theo tài khoản</h2><table><thead><tr><th>Tài khoản</th><th class="num">Đầu kỳ</th><th class="num">Cuối kỳ</th></tr></thead><tbody>
  ${["QUY", "ACB"].map(a => `<tr><td>${ACC[a]}</td><td class="num">${fm(acc(a).open)}</td><td class="num">${fm(acc(a).close)}</td></tr>`).join("")}</tbody></table>
  <p class="small muted" style="margin:0">TK ACB mới chỉ có các khoản thu ghi trong file công nợ; cần sao kê để ghi đủ các khoản chi ra từ tài khoản này.</p></section></div>`;
}

function vClose() {
  const m = UI.month, c = S.close[m] || {}, comp = balance("QUY", lastDay(m));
  const pend = S.tx.filter(t => mon(t.date) === m && (t.status === "pending" || (t.status === "checked" && needsApproval(t)))).length;
  const unk = S.tx.filter(t => mon(t.date) === m && t.type === "THU_KHAC" && (t.flags || []).some(f => f.startsWith("Chưa rõ"))).length;
  const st = giftStock(), stockTotal = S.gifts.items.reduce((s, it) => s + st[it.id].in - st[it.id].out, 0);
  const bankOk = c.bank !== undefined && c.bank !== "" && Math.round(+c.bank) === Math.round(comp);
  const giftOk = c.count !== undefined && c.count !== "" && +c.count === stockTotal;
  const checks = [
    ["Số dư sổ quỹ khớp sao kê ngày " + dmy(lastDay(m)), bankOk, `Sổ gốc: <b>${fm(comp)}</b> đ`, `<input type="number" data-close="bank" value="${c.bank ?? ""}" placeholder="Số dư theo sao kê" aria-label="Số dư sao kê">`, c.bank !== undefined && c.bank !== "" && !bankOk ? `Lệch ${fm(+c.bank - comp)} đ` : ""],
    ["Không còn giao dịch chờ kiểm, chờ duyệt", pend === 0, pend ? pend + " giao dịch còn treo" : "Đã xử lý hết", "", ""],
    ["Mọi khoản thu đã gắn đúng hợp đồng", unk === 0, unk ? unk + " khoản thu chưa rõ" : "Đã gắn đủ", "", ""],
    ["Kiểm kê quà khớp tồn sổ", giftOk, `Tồn sổ: <b>${fmt(stockTotal)}</b> đơn vị`, `<input type="number" data-close="count" value="${c.count ?? ""}" placeholder="Tổng số đếm được" aria-label="Kết quả kiểm kê">`, c.count !== undefined && c.count !== "" && !giftOk ? `Lệch ${fm(+c.count - stockTotal)}` : ""],
    ["VPM đã đối chiếu chi lương với bảng lương", !!c.wage, "Tổng thực lĩnh = các dòng chi lương của kỳ", `<label class="row small"><input type="checkbox" data-close="wage" ${c.wage ? "checked" : ""} ${canDo("lock") ? "" : "disabled"}> Đã đối chiếu</label>`, ""]
  ];
  const all = checks.every(x => x[1]), locked = isLocked(m);
  return `
  <section class="card"><h2>Đối chiếu trước khi khóa sổ ${monthLabel(m).toLowerCase()} <small>${checks.filter(x => x[1]).length}/${checks.length} đạt</small></h2>
  <ul class="issues">${checks.map(([l, ok, info, input, err]) => `<li class="${ok ? "good" : "bad"}"><i></i><span><b>${l}</b><br><span class="small muted">${info}</span>${err ? `<span class="flag">${err}</span>` : ""}</span><span>${input}</span></li>`).join("")}</ul>
  <div class="row">${locked ? `<span class="chip good">Đã khóa bởi VPM ngày ${dmy(S.locks[m])}</span>${canDo("lock") ? `<button type="button" class="btn" data-act="unlock">Mở khóa</button>` : ""}` : `<button type="button" class="btn primary" data-act="lock" ${all && canDo("lock") ? "" : "disabled"}>Khóa sổ ${monthLabel(m).toLowerCase()}</button><span class="small muted">${canDo("lock") ? (all ? "Khóa xong, không ai sửa được số của tháng này." : "Cần đạt cả 5 điểm.") : "Chỉ VPM được khóa sổ."}</span>`}</div>
  </section>
  <section class="card"><h2>Lịch sử thao tác <small>ai làm gì, lúc nào</small></h2>
  ${S.log.length ? `<div class="scroll"><table><tbody>${[...S.log].reverse().slice(0, 20).map(l => `<tr><td class="num small">${esc(l.at)}</td><td class="small">${esc(ROLES[l.role])}</td><td>${esc(l.what)}</td></tr>`).join("")}</tbody></table></div>` : `<p class="empty">Chưa có thao tác nào trong bản demo. Thử nhập một giao dịch với vai trò Tiên, rồi chuyển sang VPM để kiểm tra.</p>`}
  </section>`;
}


/* ---------- google apps script bridge ---------- */
const isGas = () => typeof window !== "undefined" && Boolean(window.google && window.google.script && window.google.script.run);

function syncGasInitial() {
  if (!isGas()) return;
  try {
    toast("Đang đồng bộ dữ liệu từ Google Sheets...");
    window.google.script.run
      .withSuccessHandler(function(res) {
        if (!res) return;
        var data = typeof res === "string" ? JSON.parse(res) : res;
        if (data) {
          S = Object.assign(S, data);
          render();
          if (data.tx && data.tx.length) {
            toast("Đã đồng bộ " + data.tx.length + " giao dịch từ Google Sheets!");
          } else {
            toast("Đã kết nối thành công với Google Sheets!");
          }
        }
      })
      .withFailureHandler(function(err) {
        console.warn("[GAS] Lỗi tải dữ liệu từ Sheets:", err);
      })
      .getInitialState();
  } catch (e) {
    console.warn("[GAS] Không thể kết nối Apps Script:", e);
  }
}

function gasSaveTx(tx) {
  if (isGas()) {
    try { window.google.script.run.apiAddTransaction(JSON.stringify(tx)); } catch(e){}
  }
}

function gasUpdateTx(id, updates) {
  if (isGas()) {
    try { window.google.script.run.apiUpdateTransaction(id, JSON.stringify(updates)); } catch(e){}
  }
}

function gasSaveContract(c) {
  if (isGas()) {
    try { window.google.script.run.apiAddContract(JSON.stringify(c)); } catch(e){}
  }
}

function gasSaveGift(mv) {
  if (isGas()) {
    try { window.google.script.run.apiAddGiftMovement(JSON.stringify(mv)); } catch(e){}
  }
}

function gasSaveAtt(staffId, dateIso, val) {
  if (isGas()) {
    try { window.google.script.run.apiSaveAttendance(staffId, dateIso, val); } catch(e){}
  }
}

function gasSetLock(month, locked) {
  if (isGas()) {
    try { window.google.script.run.apiSetMonthLock(month, locked, "VPM"); } catch(e){}
  }
}

/* ---------- events ---------- */
function log(what) { const d = new Date(); S.log.push({at: dmy(TODAY) + " " + d.toTimeString().slice(0, 5), role: UI.role, what}); }
document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.view) { UI.view = b.dataset.view; UI.ledgerFilter = "all"; UI.editTx = null; render(); window.scrollTo(0, 0); return; }
  if (b.id === "btnLogout") { doLogout(); return; }
  if (b.dataset.loginUser) { const lu = b.dataset.loginUser; $("#loginUsername").value = lu; $("#loginPassword").value = "123456"; doLogin(lu, "123456"); return; }
  if (b.dataset.go) { UI.view = b.dataset.go; UI.ledgerFilter = b.dataset.f || "all"; render(); window.scrollTo(0, 0); return; }
  if (b.dataset.lf) { UI.ledgerFilter = b.dataset.lf; render(); return; }
  if (b.dataset.dk) { UI.debtKind = b.dataset.dk; render(); return; }
  if (b.dataset.att) {
    const [sid, d] = b.dataset.att.split("|"), s = S.staff.find(x => x.id === sid), cyc = [undefined, 1, 0.5, "L", "X", 2];
    const a = S.att[s.name] || (S.att[s.name] = {days: {}}); const cur = a.days[d]; const nx = cyc[(cyc.indexOf(cur) + 1) % cyc.length];
    if (nx === undefined) delete a.days[d]; else a.days[d] = nx; gasSaveAtt(s.id, d, nx); save(); render(); return;
  }
  const act = b.dataset.act, id = b.dataset.id, t = id && S.tx.find(x => x.id === id);
  if (act === "check") { t.status = "checked"; gasUpdateTx(t.id, {status: "checked"}); log("Kiểm tra " + t.id + " · " + t.desc); save(); render(); toast(needsApproval(t) ? "Đã kiểm, chuyển chị Giàu duyệt" : "Đã kiểm, giao dịch hoàn tất"); }
  if (act === "return") { t.status = "returned"; t.note = "VPM yêu cầu bổ sung chứng từ"; gasUpdateTx(t.id, {status: "returned", note: t.note}); log("Trả lại " + t.id); save(); render(); toast("Đã trả lại cho Tiên"); }
  if (act === "approve") { t.status = "approved"; gasUpdateTx(t.id, {status: "approved"}); log("Duyệt chi " + t.id + " · " + fmt(t.amt) + " đ"); save(); render(); toast("Đã duyệt chi"); }
  if (act === "edit") { UI.editTx = id; UI.month = mon(t.date); UI.ledgerFilter = "all"; render(); window.scrollTo(0, 0); }
  if (act === "cancelEdit") { UI.editTx = null; render(); }
  if (act === "discok") { const c = S.contracts.find(x => x.id === id); c.discApproved = true; log("Duyệt chiết khấu " + c.id); save(); render(); toast("Đã duyệt chiết khấu"); }
  if (act === "fixatt") { for (const a of attAlerts()) { const s = S.att[a.s]; s.days[a.d] = S.holidays.includes(a.d) ? "L" : 2; } log("Sửa chấm công ngày lễ, chủ nhật T9"); save(); render(); toast("Đã áp dụng đề xuất chấm công"); }
  if (act === "lock") { S.locks[UI.month] = TODAY; gasSetLock(UI.month, true); log("Khóa sổ " + monthLabel(UI.month)); save(); render(); toast("Đã khóa sổ " + monthLabel(UI.month).toLowerCase()); }
  if (act === "unlock") { delete S.locks[UI.month]; gasSetLock(UI.month, false); log("Mở khóa " + monthLabel(UI.month)); save(); render(); toast("Đã mở khóa"); }
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.id === "month") { UI.month = el.value; UI.editTx = null; render(); }
  if (el.id === "onlyOver") { UI.debtOnlyOver = el.checked; render(); }
  if (el.dataset.adv) { S.staff.find(s => s.id === el.dataset.adv).advance = Math.max(0, +el.value || 0); save(); render(); }
  if (el.dataset.close) { const c = S.close[UI.month] || (S.close[UI.month] = {}); c[el.dataset.close] = el.type === "checkbox" ? el.checked : el.value; save(); render(); }
  if (el.id === "f-type") { const cat = $("#f-cat"); if (cat) cat.disabled = el.value !== "OPEX"; }
});
document.addEventListener("submit", e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === "loginForm") { doLogin($("#loginUsername").value, $("#loginPassword").value); return; }
  if (f.id === "txForm") {
    const type = $("#f-type").value, amt = Math.round(+$("#f-amt").value), date = $("#f-date").value, cat = $("#f-cat").value, contract = $("#f-contract").value;
    if (type === "OPEX" && !cat) { toast("Chọn nhóm chi phí cho khoản chi vận hành"); return; }
    if ((type === "THU_KH" || type === "THU_TV") && !contract) { toast("Chọn hợp đồng mà khoản thu này trả cho"); return; }
    if (isLocked(mon(date))) { toast(monthLabel(mon(date)) + " đã khóa sổ"); return; }
    if (UI.editTx) {
      const t = S.tx.find(x => x.id === UI.editTx);
      Object.assign(t, {type, dir: TYPES[type].dir, cat: type === "OPEX" ? cat : "", contract, acc: $("#f-acc").value, desc: $("#f-desc").value.trim()});
      t.flags = (t.flags || []).filter(x => x === "Thiếu ngày giao dịch" && date === t.date);
      t.date = date; log("Phân loại lại " + t.id + " → " + (type === "OPEX" ? CATS[cat] : TYPES[type].l)); UI.editTx = null; save(); render(); toast("Đã lưu phân loại"); return;
    }
    const doc = $("#f-doc").files[0];
    const t = {id: "N" + String(S.tx.length + 1).padStart(4, "0"), date, acc: $("#f-acc").value, dir: TYPES[type].dir, amt, desc: $("#f-desc").value.trim(), type, cat: type === "OPEX" ? cat : "", contract, flags: [], status: UI.role === "vpm" ? "checked" : "pending", doc: doc ? doc.name : "", src: "Nhập bởi " + ROLES[UI.role]};
    S.tx.push(t); S.tx.sort((a, b) => a.date.localeCompare(b.date) || a.id.localeCompare(b.id)); gasSaveTx(t); log("Ghi " + t.id + " · " + t.desc + " · " + fmt(amt) + " đ"); save(); UI.month = mon(date); render();
    toast(t.status === "pending" ? "Đã ghi, chờ VPM kiểm tra" : needsApproval(t) ? "Đã ghi, chờ chị Giàu duyệt" : "Đã ghi vào sổ");
  }
  if (f.id === "cForm") {
    const k = UI.debtKind, n = S.contracts.filter(c => c.kind === k).length + 1, fee = +$("#c-fee").value, disc = +$("#c-disc").value || 0;
    if (disc > fee) { toast("Chiết khấu không được lớn hơn phí hợp đồng"); return; }
    const c = {id: k + String(n).padStart(2, "0"), kind: k, customer: $("#c-cus").value.trim(), no: k === "KH" ? $("#c-no").value.trim() : "", tv: k === "TV" ? $("#c-tv").value.trim() : "", signed: TODAY, fee, disc, due: $("#c-due").value, terms: "", note: ""};
    S.contracts.push(c); gasSaveContract(c); log("Thêm hợp đồng " + c.id + " · " + c.customer); save(); render(); toast(fee && disc / fee > DISC_LIMIT ? "Đã thêm, chiết khấu chờ chị Giàu duyệt" : "Đã thêm hợp đồng");
  }
  if (f.id === "gForm") {
    const item = $("#g-item").value, kind = $("#g-kind").value, qty = Math.round(+$("#g-qty").value), st = giftStock()[item];
    if (kind === "out" && qty > st.in - st.out) { toast("Không đủ tồn: còn " + (st.in - st.out)); return; }
    const mvItem = {d: TODAY, item, qty, kind, to: $("#g-to").value, who: $("#g-who").value.trim(), note: "", ex: false, tx: ""};
    S.gifts.mv.push(mvItem); gasSaveGift(mvItem);
    log((kind === "out" ? "Xuất " : "Nhập ") + qty + " " + S.gifts.items.find(i => i.id === item).name); save(); render(); toast("Đã ghi phiếu " + (kind === "out" ? "xuất" : "nhập"));
  }
  if (f.id === "bForm") {
    const b = S.budget[UI.month] || (S.budget[UI.month] = {});
    f.querySelectorAll("[data-bud]").forEach(i => { if (i.value) b[i.dataset.bud] = +i.value; else delete b[i.dataset.bud]; });
    log("Giao ngân sách " + monthLabel(UI.month)); save(); render(); toast("Đã lưu ngân sách");
  }
});
$("#reset").addEventListener("click", () => {
  if ($("#reset").dataset.armed) { try { localStorage.removeItem(KEY); } catch (e) {} if (isGas()) { syncGasInitial(); } else { S = load(); render(); } delete $("#reset").dataset.armed; $("#reset").textContent = "Khôi phục dữ liệu ban đầu"; toast("Đã nạp lại dữ liệu từ Google Sheets"); }
  else { $("#reset").dataset.armed = "1"; $("#reset").textContent = "Bấm lần nữa để xóa thay đổi của bạn"; setTimeout(() => { delete $("#reset").dataset.armed; $("#reset").textContent = "Khôi phục dữ liệu ban đầu"; }, 4000); }
});
if (checkAuth()) {
  render();
  syncGasInitial();
} else {
  checkAuth();
}
</script>
