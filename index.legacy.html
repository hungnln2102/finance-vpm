function lastDay(m) { const [y, mm] = m.split("-").map(Number); return m + "-" + String(new Date(Date.UTC(y, mm, 0)).getUTCDate()).padStart(2, "0"); }

function monthTx(m) { return S.tx.filter(t => mon(t.date) === m && t.status !== "returned"); }
function opexBy(m) { const r = {}; for (const k in CATS) r[k] = 0; for (const t of monthTx(m)) if (t.type === "OPEX") r[t.cat] += t.amt; return r; }
function minBalance(acc, m) {

}
function giftStock() {

function allIssues() {

}

/* ---------- payroll ---------- */
function attDays() {
  const [y, m] = S.attMonth.split("-").map(Number), n = new Date(Date.UTC(y, m, 0)).getUTCDate(), out = [];
  for (let d = 1; d <= n; d++) { const iso = S.attMonth + "-" + String(d).padStart(2, "0"), wd = new Date(iso + "T00:00:00Z").getUTCDay(); out.push({iso, d, wd, sun: wd === 0, sat: wd === 6, hol: S.holidays.includes(iso)}); }
  return out;
}
function stdDays() { const ds = attDays(); return ds.length - ds.filter(x => x.sun).length - 0.5 * ds.filter(x => x.sat).length; }
function attAlerts() {
  const out = [];
  for (const d of attDays()) for (const s of S.staff) {
    const v = (S.att[s.name] || {days: {}}).days[d.iso];
    if (d.hol && (v === 1 || v === 0.5)) out.push({s: s.name, d: d.iso, msg: "Ngày lễ đang chấm như ngày thường"});
    if (d.sun && (v === 1 || v === 0.5)) out.push({s: s.name, d: d.iso, msg: "Chủ nhật chấm 1 – đi làm thì chọn 200%"});
  }
  return out;
}
function pit(x) {
  if (x <= 0) return 0;
  const b = [[10e6, .05], [30e6, .10], [60e6, .20], [100e6, .30], [Infinity, .35]];
  let tax = 0, prev = 0;
  for (const [cap, r] of b) { if (x > prev) tax += (Math.min(x, cap) - prev) * r; prev = cap; }
  return Math.round(tax);
}
function pay(s) {
  const a = (S.att[s.name] || {days: {}}).days, std = stdDays(), allow = s.allow.phone + s.allow.fuel + s.allow.meal + s.allow.travel;
  const rate = (s.base + allow) / std;
  let work = 0, hol = 0, holWork = 0, sunWork = 0;
  for (const d of attDays()) {
    const v = a[d.iso];
    if (v === "L") hol += 1; else if (v === "X") holWork += 1; else if (v === 2) sunWork += 1; else if (typeof v === "number") work += v;
  }
  const byDays = rate * (work + hol), extra = rate * (holWork * 3 + sunWork * 2);
  const gross = byDays + extra + s.kpi;
  const ins = s.insSalary * 0.105;
  const exempt = byDays * allow / (s.base + allow || 1) + rate * (holWork * 2 + sunWork * 1);
  const taxable = Math.max(0, gross - ins - exempt - DEDUCT_SELF - s.deps * DEDUCT_DEP);
  const tax = pit(taxable);
  return {std, work: work + hol, holWork, sunWork, byDays, extra, gross, ins, taxable, tax, net: gross - ins - tax - s.advance};
}

function vClose() {
  const m = UI.month, c = S.close[m] || {}, comp = balance("QUY", lastDay(m));
  const pend = S.tx.filter(t => mon(t.date) === m && (t.status === "pending" || (t.status === "checked" && needsApproval(t)))).length;
  const unk = S.tx.filter(t => mon(t.date) === m && t.type === "THU_KHAC" && (t.flags || []).some(f => f.startsWith("Chưa rõ"))).length;
  const st = giftStock(), stockTotal = S.gifts.items.reduce((s, it) => s + st[it.id].in - st[it.id].out, 0);
  const bankOk = c.bank !== undefined && c.bank !== "" && Math.round(+c.bank) === Math.round(comp);
  const giftOk = c.count !== undefined && c.count !== "" && +c.count === stockTotal;
  const checks = [
    ["Số dư sổ quỹ khớp sao kê ngày " + dmy(lastDay(m)), bankOk, `Sổ gốc: <b>${fm(comp)}</b> đ`, `<input type="number" data-close="bank" value="${c.bank ?? ""}" placeholder="Số dư theo sao kê" aria-label="Số dư sao kê">`, c.bank !== undefined && c.bank !== "" && !bankOk ? `Lệch ${fm(+c.bank - comp)} đ` : ""],
    ["Không còn giao dịch chờ kiểm, chờ duyệt", pend === 0, pend ? pend + " giao dịch còn treo" : "Đã xử lý hết", "", ""],
    ["Mọi khoản thu đã gắn đúng hợp đồng", unk === 0, unk ? unk + " khoản thu chưa rõ" : "Đã gắn đủ", "", ""],
    ["Kiểm kê quà khớp tồn sổ", giftOk, `Tồn sổ: <b>${fmt(stockTotal)}</b> đơn vị`, `<input type="number" data-close="count" value="${c.count ?? ""}" placeholder="Tổng số đếm được" aria-label="Kết quả kiểm kê">`, c.count !== undefined && c.count !== "" && !giftOk ? `Lệch ${fm(+c.count - stockTotal)}` : ""],
    ["VPM đã đối chiếu chi lương với bảng lương", !!c.wage, "Tổng thực lĩnh = các dòng chi lương của kỳ", `<label class="row small"><input type="checkbox" data-close="wage" ${c.wage ? "checked" : ""} ${canDo("lock") ? "" : "disabled"}> Đã đối chiếu</label>`, ""]
  ];
  const all = checks.every(x => x[1]), locked = isLocked(m);
  return `
  <section class="card"><h2>Đối chiếu trước khi khóa sổ ${monthLabel(m).toLowerCase()} <small>${checks.filter(x => x[1]).length}/${checks.length} đạt</small></h2>
  <ul class="issues">${checks.map(([l, ok, info, input, err]) => `<li class="${ok ? "good" : "bad"}"><i></i><span><b>${l}</b><br><span class="small muted">${info}</span>${err ? `<span class="flag">${err}</span>` : ""}</span><span>${input}</span></li>`).join("")}</ul>
  <div class="row">${locked ? `<span class="chip good">Đã khóa bởi VPM ngày ${dmy(S.locks[m])}</span>${canDo("lock") ? `<button type="button" class="btn" data-act="unlock">Mở khóa</button>` : ""}` : `<button type="button" class="btn primary" data-act="lock" ${all && canDo("lock") ? "" : "disabled"}>Khóa sổ ${monthLabel(m).toLowerCase()}</button><span class="small muted">${canDo("lock") ? (all ? "Khóa xong, không ai sửa được số của tháng này." : "Cần đạt cả 5 điểm.") : "Chỉ VPM được khóa sổ."}</span>`}</div>
  </section>
  <section class="card"><h2>Lịch sử thao tác <small>ai làm gì, lúc nào</small></h2>
  ${S.log.length ? `<div class="scroll"><table><tbody>${[...S.log].reverse().slice(0, 20).map(l => `<tr><td class="num small">${esc(l.at)}</td><td class="small">${esc(ROLES[l.role])}</td><td>${esc(l.what)}</td></tr>`).join("")}</tbody></table></div>` : `<p class="empty">Chưa có thao tác nào trong bản demo. Thử nhập một giao dịch với vai trò Tiên, rồi chuyển sang VPM để kiểm tra.</p>`}
  </section>`;
}

/* ---------- events ---------- */
function log(what) { const d = new Date(); S.log.push({at: dmy(TODAY) + " " + d.toTimeString().slice(0, 5), role: UI.role, what}); }
document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.view) { UI.view = b.dataset.view; UI.ledgerFilter = "all"; UI.editTx = null; render(); window.scrollTo(0, 0); return; }
  if (b.dataset.role) { UI.role = b.dataset.role; UI.editTx = null; render(); toast("Đang làm việc với vai trò " + ROLES[UI.role]); return; }
  if (b.dataset.go) { UI.view = b.dataset.go; UI.ledgerFilter = b.dataset.f || "all"; render(); window.scrollTo(0, 0); return; }
  if (b.dataset.lf) { UI.ledgerFilter = b.dataset.lf; render(); return; }
  if (b.dataset.dk) { UI.debtKind = b.dataset.dk; render(); return; }
  if (b.dataset.att) {
    const [sid, d] = b.dataset.att.split("|"), s = S.staff.find(x => x.id === sid), cyc = [undefined, 1, 0.5, "L", "X", 2];
    const a = S.att[s.name] || (S.att[s.name] = {days: {}}); const cur = a.days[d]; const nx = cyc[(cyc.indexOf(cur) + 1) % cyc.length];
    if (nx === undefined) delete a.days[d]; else a.days[d] = nx; save(); render(); return;
  }
  const act = b.dataset.act, id = b.dataset.id, t = id && S.tx.find(x => x.id === id);
  if (act === "check") { t.status = "checked"; log("Kiểm tra " + t.id + " · " + t.desc); save(); render(); toast(needsApproval(t) ? "Đã kiểm, chuyển chị Giàu duyệt" : "Đã kiểm, giao dịch hoàn tất"); }
  if (act === "return") { t.status = "returned"; t.note = "VPM yêu cầu bổ sung chứng từ"; log("Trả lại " + t.id); save(); render(); toast("Đã trả lại cho Tiên"); }
  if (act === "approve") { t.status = "approved"; log("Duyệt chi " + t.id + " · " + fmt(t.amt) + " đ"); save(); render(); toast("Đã duyệt chi"); }
  if (act === "edit") { UI.editTx = id; UI.month = mon(t.date); UI.ledgerFilter = "all"; render(); window.scrollTo(0, 0); }
  if (act === "cancelEdit") { UI.editTx = null; render(); }
  if (act === "discok") { const c = S.contracts.find(x => x.id === id); c.discApproved = true; log("Duyệt chiết khấu " + c.id); save(); render(); toast("Đã duyệt chiết khấu"); }
  if (act === "fixatt") { for (const a of attAlerts()) { const s = S.att[a.s]; s.days[a.d] = S.holidays.includes(a.d) ? "L" : 2; } log("Sửa chấm công ngày lễ, chủ nhật T9"); save(); render(); toast("Đã áp dụng đề xuất chấm công"); }
  if (act === "lock") { S.locks[UI.month] = TODAY; log("Khóa sổ " + monthLabel(UI.month)); save(); render(); toast("Đã khóa sổ " + monthLabel(UI.month).toLowerCase()); }
  if (act === "unlock") { delete S.locks[UI.month]; log("Mở khóa " + monthLabel(UI.month)); save(); render(); toast("Đã mở khóa"); }
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.id === "month") { UI.month = el.value; UI.editTx = null; render(); }
  if (el.id === "onlyOver") { UI.debtOnlyOver = el.checked; render(); }
  if (el.dataset.adv) { S.staff.find(s => s.id === el.dataset.adv).advance = Math.max(0, +el.value || 0); save(); render(); }
  if (el.dataset.close) { const c = S.close[UI.month] || (S.close[UI.month] = {}); c[el.dataset.close] = el.type === "checkbox" ? el.checked : el.value; save(); render(); }
  if (el.id === "f-type") { const cat = $("#f-cat"); if (cat) cat.disabled = el.value !== "OPEX"; }
});
document.addEventListener("submit", e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === "txForm") {
    const type = $("#f-type").value, amt = Math.round(+$("#f-amt").value), date = $("#f-date").value, cat = $("#f-cat").value, contract = $("#f-contract").value;
    if (type === "OPEX" && !cat) { toast("Chọn nhóm chi phí cho khoản chi vận hành"); return; }
    if ((type === "THU_KH" || type === "THU_TV") && !contract) { toast("Chọn hợp đồng mà khoản thu này trả cho"); return; }
    if (isLocked(mon(date))) { toast(monthLabel(mon(date)) + " đã khóa sổ"); return; }
    if (UI.editTx) {
      const t = S.tx.find(x => x.id === UI.editTx);
      Object.assign(t, {type, dir: TYPES[type].dir, cat: type === "OPEX" ? cat : "", contract, acc: $("#f-acc").value, desc: $("#f-desc").value.trim()});
      t.flags = (t.flags || []).filter(x => x === "Thiếu ngày giao dịch" && date === t.date);
      t.date = date; log("Phân loại lại " + t.id + " → " + (type === "OPEX" ? CATS[cat] : TYPES[type].l)); UI.editTx = null; save(); render(); toast("Đã lưu phân loại"); return;
    }
    const doc = $("#f-doc").files[0];
    const t = {id: "N" + String(S.tx.length + 1).padStart(4, "0"), date, acc: $("#f-acc").value, dir: TYPES[type].dir, amt, desc: $("#f-desc").value.trim(), type, cat: type === "OPEX" ? cat : "", contract, flags: [], status: UI.role === "vpm" ? "checked" : "pending", doc: doc ? doc.name : "", src: "Nhập bởi " + ROLES[UI.role]};
    S.tx.push(t); S.tx.sort((a, b) => a.date.localeCompare(b.date) || a.id.localeCompare(b.id)); log("Ghi " + t.id + " · " + t.desc + " · " + fmt(amt) + " đ"); save(); UI.month = mon(date); render();
    toast(t.status === "pending" ? "Đã ghi, chờ VPM kiểm tra" : needsApproval(t) ? "Đã ghi, chờ chị Giàu duyệt" : "Đã ghi vào sổ");
  }
  if (f.id === "cForm") {
    const k = UI.debtKind, n = S.contracts.filter(c => c.kind === k).length + 1, fee = +$("#c-fee").value, disc = +$("#c-disc").value || 0;
    if (disc > fee) { toast("Chiết khấu không được lớn hơn phí hợp đồng"); return; }
    const c = {id: k + String(n).padStart(2, "0"), kind: k, customer: $("#c-cus").value.trim(), no: k === "KH" ? $("#c-no").value.trim() : "", tv: k === "TV" ? $("#c-tv").value.trim() : "", signed: TODAY, fee, disc, due: $("#c-due").value, terms: "", note: ""};
    S.contracts.push(c); log("Thêm hợp đồng " + c.id + " · " + c.customer); save(); render(); toast(fee && disc / fee > DISC_LIMIT ? "Đã thêm, chiết khấu chờ chị Giàu duyệt" : "Đã thêm hợp đồng");
  }
  if (f.id === "gForm") {
    const item = $("#g-item").value, kind = $("#g-kind").value, qty = Math.round(+$("#g-qty").value), st = giftStock()[item];
    if (kind === "out" && qty > st.in - st.out) { toast("Không đủ tồn: còn " + (st.in - st.out)); return; }
    S.gifts.mv.push({d: TODAY, item, qty, kind, to: $("#g-to").value, who: $("#g-who").value.trim(), note: "", ex: false, tx: ""});
    log((kind === "out" ? "Xuất " : "Nhập ") + qty + " " + S.gifts.items.find(i => i.id === item).name); save(); render(); toast("Đã ghi phiếu " + (kind === "out" ? "xuất" : "nhập"));
  }
  if (f.id === "bForm") {
    const b = S.budget[UI.month] || (S.budget[UI.month] = {});
    f.querySelectorAll("[data-bud]").forEach(i => { if (i.value) b[i.dataset.bud] = +i.value; else delete b[i.dataset.bud]; });
    log("Giao ngân sách " + monthLabel(UI.month)); save(); render(); toast("Đã lưu ngân sách");
  }
});
$("#reset").addEventListener("click", () => {
  if ($("#reset").dataset.armed) { try { localStorage.removeItem(KEY); } catch (e) {} S = load(); delete $("#reset").dataset.armed; $("#reset").textContent = "Khôi phục dữ liệu ban đầu"; render(); toast("Đã khôi phục dữ liệu từ file khách"); }
  else { $("#reset").dataset.armed = "1"; $("#reset").textContent = "Bấm lần nữa để xóa thay đổi của bạn"; setTimeout(() => { delete $("#reset").dataset.armed; $("#reset").textContent = "Khôi phục dữ liệu ban đầu"; }, 4000); }
});
render();
</script>

</body></html>
